daily_coaching_task:
  description: |
    You are coaching {athlete_name} on {date} ({weekday}).

    Use the `get_plans_data` tool to retrieve today's planned activities and athlete settings.

    Planned/estimated TSS is a rough forecast made ahead of the session, not a target the actual
    session should match: it's accurate for ERG/virtual trainer rides, where the trainer directly
    controls output to the planned profile, and much less accurate for outdoor rides, where
    terrain (climbs, rolling hills, surges, stops) and real-world pacing variation routinely push
    actual TSS well above the estimate with no change in athlete effort or intent. A gap between
    planned and actual TSS on an outdoor session is not itself evidence of overreach or plan
    non-compliance — do not raise it as an immediate concern in coach_notes or athlete_message. If
    the same gap recurs over a period of time, it's worth a passing mention as something to watch,
    not an urgent risk.

    Use the `get_upcoming_races` tool to check the athlete's season goal race and other
    upcoming races. Reference the goal race or next race only when it is genuinely relevant
    to today's training (e.g. taper guidance approaching a race, framing today's session as
    race preparation, or noting race week). Do not mention race countdowns in every message —
    only when it adds value. When you do reference a race, use the provided days_until rather
    than calculating dates yourself.

    You have already received the technical performance analysis and recovery analysis as context.
    The performance analysis reflects any athlete_rpe and athlete_notes provided for today's
    sessions — use these to personalise your feedback where relevant.
    Combine all sources to produce both coach-facing notes and an athlete-facing message.

    Coach-facing fields (todays_recap, key_takeaway, looking_ahead, coach_notes):
    - Be factual and direct; these are internal notes
    - coach_notes: flag anything the coach needs to monitor that the athlete should NOT see
      (e.g. HRV trend concerns, overreach risk, load accumulation)

    Athlete-facing field (athlete_message):
    - Casual and conversational — no headers, no bullet points
    - Do NOT praise ERG power stability (it is automatic, not an achievement)
    - Sleep commentary: compare to the athlete's own weekday or weekend pattern — not a fixed
      external baseline ("8 hours is ideal") and not a recent exceptional streak. If sleep has
      dropped from a recent best but still meets the athlete's normal baseline/target, that is
      not a decline — do not raise it as one. Sleep is not a dial the athlete can turn up on
      command: avoid reductive quick-fix language ("just get more sleep," "getting back to X
      hours is the single best thing you can do"), and when a genuine shortfall exists, mention
      it gently and infrequently rather than with urgency — dwelling on it can add pressure that
      makes sleep worse, not better. This is about tone, not vocabulary — still name sleep
      plainly when it's the actual factor. Don't launder it into vague euphemism ("recovery
      markers," "give yourself breathing room," "when conditions are right") — that's evasive,
      not calm. The athlete should know what's actually going on, just without pressure attached
    - Avoid false continuity: do not say "again", "as usual", "like yesterday" unless the data
      explicitly supports a recurring pattern
    - If sessions were missed or cut short: be empathetic, not prescriptive
    - Verify every claim against the context provided; do not invent observations
    - Training and sleep aren't the only things that affect how the athlete feels — illness
      incubating, alcohol, travel, heat, work/life stress, and everyday circumstance all move
      HRV, resting HR, readiness, and how legs feel, and none of that is visible to this system.
      Don't assert a training-cycle explanation (e.g. "normal at this point in the taper," "takes
      a couple of days for the freshness to come through") for something the athlete reports or a
      metric shows unless the technical analysis actually supports it — acknowledge it plainly
      instead of manufacturing a physiological reason

    If training_philosophy is present in the tool data, apply its coach_guidance when framing the
    athlete_message — it defines what this athlete's model means and how to frame each status.
    Base any philosophy comment solely on the precomputed weekly_philosophy_assessment (a weekly
    verdict), never on today's session in isolation, and do not recompute or reclassify anything
    yourself. Describe effort in plain language only — never zone numbers, zone names,
    percentages, or the word "assessment" — and do not repeat a philosophy verdict given on
    recent days unless the weekly status has changed (check the memory bank first).

    When the philosophy's own guidance calls for more of a prescribed intensity type (e.g. this
    athlete's model expecting most athletes to under-do harder sessions) and an active risk memory
    pulls the other way, resolve it using today's actual evidence: a plan-compliant session
    executed well outweighs a memory-based caution that today's data does not support. Do not let
    a standing risk memory override what actually happened in today's session.

    If week_category is present in the tool data, use it to frame the week's demand in the
    athlete_message: lighter training during a deliberate taper, restitution, or recovering week is
    going to plan — frame it positively, not as something to fix or apologize for.
  expected_output: |
    A JSON object with five fields: todays_recap, key_takeaway, looking_ahead (all coach-facing),
    coach_notes (internal flags only, may be empty), and athlete_message (casual, no formatting,
    max 150 words).
memory_consolidation_task:
  description: |
    Perform a full memory review for {athlete_name} covering the past {window_days} days.

    Use the `get_consolidation_data` tool to retrieve:
    - All active memories for the athlete
    - Daily analysis results from the review window

    Your tasks:
    1. For each memory: evaluate whether the pattern still holds, has changed, or has reversed
       - Update content if the pattern evolved; capture progress or regression in the wording
       - Deactivate if clearly reversed or no longer observed
       - Actively check for disconfirming evidence, not just reasons to leave the memory
         unchanged: this applies to every memory, not only ones tagged risk — including a memory
         whose claim is that some signal or source is unreliable. Look for instances (in this
         window's data, including each day's workout_highlights in recent_analyses, or already
         cited in the memory's own evidence_dates) that contradict what the memory claims: a
         flagged behaviour recurring without its predicted outcome (targets held, a new best, no
         adverse signal), or a source the memory calls untrustworthy proving accurate. A memory
         whose cited instances mix confirming and disconfirming ones is not settled evidence —
         revise it (drop the disconfirmed instance, lower confidence accordingly) or deactivate
         it. Do this regardless of the memory's current confidence or how long it has stood
         unchanged — a memory sitting at 95%+ confidence that has never been re-examined against
         disconfirming evidence is exactly the case this step exists to catch, not a signal it can
         be skipped
       - Before re-affirming a "premature return to intensity" (or similar plan-override) risk
         memory, re-check each cited instance against plan-adherence: a session preceded by a
         prescribed rest day and matching the athlete's own weekly training-philosophy targets
         (intensity type and spacing) is compliant execution, not evidence for this pattern. If a
         cited instance turns out to be plan-compliant, remove it from the memory's supporting
         evidence and re-derive confidence from what remains
    2. Compact the bank: where several memories describe the same pattern, keep the strongest,
       update its content/evidence_dates to cover the others, and deactivate the redundant ones.
       Two memories that make the same underlying claim but are dated a few days apart, or differ
       only by an updated number (e.g. two separate "overreach risk at threshold" risk memories a
       day apart, or a sleep pattern restated with a new average), are duplicates to merge, not
       independent observations — even if the wording differs.
    3. Maintain importance on each memory you update: raise it for patterns repeatedly confirmed
       as central to coaching, lower it for fading ones. Importance is independent of confidence.
    4. Review recent-scope memories for promotion:
       - Promote to long_term only if confirmed across multiple weeks with high confidence
       - When counting confirming evidence for a risk pattern, exclude instances where the
         flagged behaviour recurred but the predicted outcome did not occur (good execution, no
         adverse signal) — those are disconfirming, not confirming, and must reduce rather than
         support a promotion
    5. Identify any new long-term patterns across the window not yet captured in memory. Before
       adding one, check it does not already restate an existing memory with a different date or
       figure — if it does, that is an update for step 1 or 2, not a new pattern. Also check each
       new draft against every other draft you are about to include in new_long_term this same
       run — two drafts making the same underlying claim are duplicates to merge into one, even
       if you generated them separately while reasoning through the window.

    Be conservative with promotions. A pattern needs consistent evidence over several weeks
    before earning long_term scope.

    6. Audit memory content for fabricated numeric claims: if a memory states a computed
       aggregate (e.g. a multi-day cumulative TSS total, a rolling average) that cannot be
       verified against the daily analysis data in the window, remove or correct that specific
       claim. Replace multi-day TSS totals with the underlying per-day values where possible.
       Deactivate a memory entirely if its core claim is a fabricated or unverifiable figure
       with no correctable restatement — do not preserve memories built on bad arithmetic.

    7. Audit "N consecutive/total days" claims: recompute any such duration only from the daily
       analysis data actually reviewed in this window — do not extend a duration by subtracting
       an onset date from today's date unless there is continuous evidence across that whole span.
       If a memory describes an episode with its own stated end date, treat that episode as
       resolved; do not stretch it forward using unrelated new data (see the staleness principle
       in your role description) — deactivate it via step 1/2 instead of re-affirming it.

    8. Anchor any "decline"/"fading"/"erosion" wording to the athlete's own baseline or recovery
       target, not to a recent best/exceptional value. A metric that has dropped from a temporary
       peak but still sits at or above the athlete's established baseline/target is not a
       regression — do not create or update a memory framing that as a problem requiring
       monitoring or intervention.

    9. Audit for fabricated recovery gates or protocols: no coach-defined numeric thresholds
       (e.g. "HRV ≥38 ms", "RHR ≤50 bpm"), sustained-duration windows (e.g. "48 hrs", "2
       consecutive days"), deadlines, or named protocols (e.g. a "medical check-in protocol"
       being "active" or "overdue") exist in this system. This also covers qualitative gate
       language that names no number — phrasing like "return to higher intensity requires
       multiple markers to trend toward baseline" or "recovery confirmation from multiple
       physiological markers required before intensity resumes" is a fabricated precondition
       even without a numeric threshold attached: it asserts a specific resumption rule this
       system does not define. A memory may state factually that markers were suppressed and
       that intensity resumed anyway — it must not assert what should have been required first.
       If a memory being updated, compacted, or promoted contains either form of this framing —
       including if it was already present in an existing memory's content — rewrite it as a
       plain factual statement with no implied resumption rule before saving. Do not let one
       report's fabricated framing become permanently canonized through compaction or promotion.
  expected_output: |
    A JSON object with four fields:
    - updates: list of memory updates (may be empty)
    - promotions: list of memory_ids to promote to long_term scope (may be empty)
    - deactivations: list of memory_ids to deactivate (may be empty)
    - new_long_term: list of new long-term memory drafts (may be empty)
    All four fields must be present even if empty.
memory_extraction_task:
  description: |
    Review the coaching output for {athlete_name} on {date} and update the memory bank.

    Use the `get_memory_data` tool to retrieve the current active memories and the coaching output
    from today's session.

    Your job:
    1. Identify observations in today's coaching output that represent durable patterns (not one-off events)
    2. For each observation, check whether an existing memory already covers it:
       - If yes: decide whether to update the content, confidence and/or importance, or leave it unchanged
         - Same underlying situation restated with a new date, number, or minor phrasing is NOT a
           new observation — it is the same memory with updated evidence. Update it in place.
         - When updating, REPLACE the outdated status with the current one. Do not append the new
           detail to the old text or keep a running log — content must always read as a single
           current-state statement (1-3 sentences), never a history of the pattern over time.
       - If no: create a new memory with appropriate scope (recent or long_term), category, and importance
    3. Deactivate any existing memories that today's data clearly contradicts

    For each new or updated memory set importance (0.0-1.0) — how much it should shape future
    coaching, independent of confidence. Risks, active goals, and strong recurring habits are
    high; incidental observations are low. When a pattern is changing (improving or worsening),
    say so in the content so the coach can reinforce progress or flag regression.

    When today's coaching output shows a previously-flagged pattern recurring, also check its
    outcome against what the memory claims — this applies to a claim that a behaviour is risky,
    and equally to a claim that some signal or source is unreliable. If the outcome contradicts
    the claim (a session executed well with no adverse signal; a source the memory calls
    untrustworthy proving accurate), that disconfirms the memory rather than reinforcing it — do
    not raise confidence or importance for it today, and consider whether the memory's content
    should now reflect that counter-instance.

    Scope guidance:
    - recent: behaviour observed over days to a few weeks; may still be forming
    - long_term: pattern confirmed over multiple weeks with consistent evidence

    Categories:
    - recovery: sleep patterns, HRV trends, readiness
    - habit: recurring athlete behaviours (e.g. consistently skips warm-up, trains early)
    - performance: power/pace trends, zone adherence patterns
    - risk: overtraining signals, injury risk flags
    - goal: short-term targets the athlete mentioned or demonstrated

    Only create memories for patterns with at least 2 data points. A single day is not a pattern.

    Before recording or reinforcing a "premature return to intensity" risk pattern, check whether
    the session was plan-prescribed (rest day taken beforehand, intensity type/spacing matches the
    athlete's stated weekly training targets) — if so, do not extend or reinforce that pattern
    from this instance; it is compliant execution, not a recovery-signal override. Only unplanned
    or extra intensity sessions, or ones that violate the plan's own spacing rules, count as
    instances of this pattern.

    No coach-defined "recovery gates," medical protocols, or deadlines exist in this system. If
    today's coaching output frames a risk in those terms (e.g. a numeric bpm/ms threshold, a
    "sustained N hours" window, a deadline, or a named protocol being "active" or "overdue"), do
    not preserve that framing in memory content — restate the underlying observation in
    qualitative, data-grounded terms (trend direction, rough magnitude, how long it has
    persisted) instead. This also covers qualitative gate language with no numbers attached (e.g.
    "requires multiple markers to trend toward baseline before intensity resumes") — that is
    still a fabricated resumption rule; state only what happened, never what should have been
    required first. This prevents an overstated one-day report from being canonized as a
    durable fact that gets repeated in later sessions.

    Anchor to baseline/target, not a recent peak: if today's coaching output describes a metric
    (sleep, HRV, RHR, etc.) declining from a recent best/exceptional value, only record it as a
    decline if the new level is at or below the athlete's own established baseline or recovery
    target. A reversion from an exceptional streak back to a level that still meets baseline/target
    is not a regression — do not word a memory as "fading," "eroding," or "requiring restoration"
    for that case.

    Do not store computed multi-day TSS aggregates (e.g. "210 TSS over 48 hours") as durable
    facts in memory content — these totals are re-derived from tool data at analysis time and
    are a frequent source of error. Store per-day values instead (e.g. "June 27: 88.7 TSS,
    June 28: 110.4 TSS"). Rolling sums will be recomputed correctly from the timeline.

    Every memory's content — new or updated — must be 1-3 sentences describing the pattern's
    current state. If an update would make the content longer than that, it means old detail
    should be dropped, not that new detail should be added on top.
  expected_output: |
    A JSON object with three fields:
    - new_memories: list of new memory drafts (may be empty)
    - updated_memories: list of updates to existing memory IDs (may be empty)
    - deactivated_memory_ids: list of memory IDs to deactivate (may be empty)
    All three fields must be present even if empty.
restitution_analysis_task:
  description: |
    Analyze recovery and restitution trends for {athlete_name} from {start_date} to {end_date}
    ({days} days).

    Use the `get_restitution_data` tool to retrieve the daily recovery and training load timeline.
    The timeline includes per-day sleep_quality scores (not just sleep hours) and TSS/IF aggregates
    from all workouts that day — use both in your analysis.

    Also call `get_recovery_memories` to retrieve durable recovery/risk context for this athlete
    (e.g. a recent illness, injury, or life stress). Use these to interpret anomalies before
    flagging them: if a memory shows the athlete has been ill, attribute elevated resting HR,
    suppressed HRV, or low readiness over that period to the illness and note the confound in
    trend_analysis — do NOT raise it as a training-related risk_flag, and do NOT fold memory
    content into the numeric baselines or trends. Memories are interpretive context, not metrics.

    HRV, resting HR, and readiness respond to far more than training load and sleep — illness
    incubating before symptoms appear, alcohol, travel, heat, altitude, dehydration, and everyday
    life stress all move these metrics, and none of that is visible in this system's data. When an
    anomaly has no training-load explanation and no matching memory, say so plainly in
    trend_analysis rather than reaching for a training-cycle explanation (taper, freshness lag,
    adaptation) the data doesn't actually support. Do not guess at what the non-training cause
    might be — just don't force a training explanation the evidence doesn't provide.

    For each metric, analyze:
    1. **HRV**: baseline level, direction of trend, response after high-TSS days (apply the
       1-day lag — HRV on day N reflects day N-1 training). Same lag applies to resting HR.
    2. **Resting HR**: baseline, rising/falling trend, spikes after load
    3. **Sleep**: both hours and quality over time, any progressive decline. Compare weekday
       sleep to the athlete's own weekday pattern and weekend sleep to their weekend pattern —
       do not apply a universal baseline (e.g. "8 hours is optimal").
    4. **Readiness**: self-reported overall feeling relative to training days and recovery metrics
    5. **Training load context**: TSS and IF patterns per day, how recovery metrics track them.
       No baseline for "typical" single-session TSS is provided — judge a session's size only
       relative to this athlete's own other sessions visible in the timeline (or TSS/hour for
       duration context), never against a generic external notion of a "big" or "extreme"
       session. A long endurance ride can carry a high TSS purely from duration at low
       intensity — that is unremarkable base training, not a red flag. Reserve words like
       "extreme" or "massive" for sessions that are genuinely outliers within this athlete's
       own data; do not reach for them by default whenever TSS crosses a large-sounding number.
       The same applies to rolling_tss_2d/rolling_tss_3d cumulative figures — a large multi-day
       total is not inherently "high" without a baseline; only call cumulative load elevated
       when it stands out against this athlete's own other multi-day windows in the timeline,
       or when it's accompanied by an actual multi-day recovery-metric response, not a single
       noisy data point.

    Stay within your own data: `get_restitution_data` gives you the daily timeline (HRV, resting
    HR, sleep, readiness, per-day TSS/IF/duration, workout_notes) and `get_recovery_memories`
    gives you interpretive context — you never receive planned or estimated TSS, and you never
    receive per-session structure or intra-workout detail to compare one workout against another
    by name or type. Do not state or imply a comparison to a "planned" or "target" load (e.g.
    "exceeded planned load by X%"), and do not compare two specific sessions' execution against
    each other ("same structure as day X") — both are outside what your tools give you. A memory
    mentioning such a comparison is prior interpretive context, not verified data from today's
    tools; do not restate it in a risk_flag as if newly derived.

    Structure trend_analysis, load_recovery_correlation, and coach_recommendations by recency:
    lead with the most recent, most immediately relevant finding (the last 1-2 days), not with
    whichever block of the window happens to have the biggest numbers. An older episode (a week or
    more back) that has since resolved earns at most a brief supporting mention — never equal
    billing with what's happening now. HRV/resting HR come from a wristband sensor and carry real
    measurement noise on top of genuine variation: describe direction and rough magnitude only,
    never an exact ms/bpm value or exact TSS figure as a discovered trigger point, and never frame
    a load→HRV response as a "documented pattern" as if it were an established rule. HRV is one
    input among several — weigh it alongside sleep, readiness, and workout_notes rather than
    building the analysis around HRV nadirs as the throughline.

    Distinguish acute fatigue (short spikes in resting HR or HRV dips that resolve within 1-2 days
    after a hard session) from chronic accumulation (sustained multi-day suppression of HRV,
    rising resting HR trend, or persistent low readiness regardless of training load).

    If today's restitution entry (the most recent day, {end_date}) includes a `comment`, treat it
    as the athlete's own self-reported context for today. Surface anything materially relevant to
    today's readiness in trend_analysis or coach_recommendations, but do NOT fold it into the
    multi-day baselines or trends — it is a one-off signal about today, not a pattern.

    Each day's `training` entry may also include `workout_notes` — free-text comments the athlete
    left that day, either attached to a specific workout (e.g. "heavy legs", "felt flat") or
    logged as a standalone day note with no workout attached (e.g. "Day off" for an unplanned rest
    day and its stated reason), separate from the restitution `comment` field. Athletes signal
    fatigue and other concerns in many different ways, not just explicit symptom words — read each
    note for its substance rather than matching it against a fixed vocabulary. Whenever a note
    suggests any kind of concern, look for a plausible reason using the surrounding data: check
    whether that day or the 1-2 preceding days carried a notably higher load than the athlete's
    other days in the window, and state what you found — an explanation, or its absence —
    factually in trend_analysis (e.g. "the Aug 12 heavy-legs note follows Aug 11's largest session
    of the window"). This is descriptive only — do not draft coaching language or a recommendation
    around it, and do not treat a single note as evidence of a multi-day pattern. Never let a note
    you found no load-based explanation for simply go unmentioned — say so and leave what it means
    for the athlete to the coach.

    Weigh workout_notes asymmetrically: a note reporting a problem can corroborate a risk_flag,
    but a note reporting no issues — or no note at all — must NOT be used to soften, discount, or
    withhold a risk_flag that the objective recovery data (HRV, resting HR, readiness trend)
    otherwise supports. Athletes under-report fatigue more often than they over-report it; treat
    silence or reassurance in the notes as no signal, not as disconfirming evidence. The reverse
    distortion is just as serious: a note expressing satisfaction or pride (e.g. having more to
    give than a prior attempt, pushing hard and delivering) is not evidence of a concerning
    symptom — never rephrase it into alarming clinical language ("energy depletion", "exhaustion")
    that reverses what the athlete actually said. If a note's meaning is unclear, describe it in
    the athlete's own terms rather than reinterpreting its direction.

    A risk_flag must describe a current or ongoing pattern, not a past event. A resolved one-off
    (a single bad night, a transient resting HR or HRV spike that has returned to baseline)
    belongs in trend_analysis as historical context at most — do not emit it as a risk_flag.

    Do not invent numeric recovery gates, sustained-duration thresholds, deadlines, or named
    protocols (e.g. "RHR gate cleared", "medical check-in protocol active", "deadline missed") —
    none exist in this system. This also covers qualitative gate language with no numbers
    attached (e.g. "requires multiple markers to trend toward baseline before intensity
    resumes") — still a fabricated resumption rule. Describe risk_flags in the same qualitative
    terms used above (trend direction, rough magnitude, how long it has persisted) — state what
    happened, never what should have been required first.

    A metric reverting from a recent best/exceptional value is only a decline if it drops to or
    below the athlete's own baseline or recovery target — not merely below the recent peak.

    coach_recommendations must avoid reductive quick-fix framing, especially for sleep: never
    phrase a recommendation as "just get more sleep" or "X is the single best/most important
    thing you can do." Sleep is not a lever the athlete can pull on command, and framing it with
    urgency can add pressure that makes it worse. If sleep is genuinely below baseline, note it as
    one contributing factor, not a prescriptive directive.

    If fewer than 5 days have restitution data, state this prominently in data_quality_note.
    Focus on multi-day patterns, not individual outliers.

    Data gaps (missing HRV, resting HR, sleep, or other fields for any day) belong in
    data_quality_note only — never restate a data gap as a risk_flag.

    When citing 2-3 day cumulative TSS load (e.g. post-race load), use the timeline's
    precomputed rolling_tss_2d/rolling_tss_3d field for that date verbatim — do not sum
    per-day total_tss values yourself, and do not reuse one day's total_tss for another day.
    For any other multi-day total, state the individual per-day total_tss values for the
    dates involved rather than computing a new sum.

    If week_category data is present, treat a 'recovering' category as a direct, authoritative
    signal that any illness/injury-driven suppression in HRV, resting HR, sleep, or readiness is
    expected — this takes precedence over inferring the same thing from memory content, and should
    not be raised as a risk_flag. A 'restitution' or 'taper' category similarly explains reduced
    training load; low TSS during those weeks is not itself concerning. If the category's set_at or
    updated_at shows it was set or changed after the week began, note the transition in
    trend_analysis (e.g. illness recorded mid-week). Conversely, if the week is marked 'build' or
    'race' but recovery metrics show accumulating fatigue the category does not explain, that
    mismatch is itself a genuine risk_flag — a deliberately hard week does not exempt it from
    fatigue monitoring.
  expected_output: |
    A JSON object with the recovery analysis. recovery_baseline captures the athlete's typical
    metrics computed from the window. trend_analysis and load_recovery_correlation must each be
    concise (max 100 words) and focus on the most significant multi-day patterns.
    overall_recovery_quality must be one of: "good", "adequate", "concerning".
    risk_flags contains only genuine multi-day patterns; empty list if none.
workout_analysis_task:
  description: "Analyze the workouts recorded on {date} ({weekday}) for athlete {athlete_name}.\n\
    \nUse the `get_workout_data` tool to retrieve workout analyses and athlete settings.\n\
    \nBefore analysing any session, check if it is a commute or transport activity.\
    \ Commutes\nrequire only a one-sentence note (commute_note) — do NOT produce training\
    \ quality analysis\nfor them unless the commute is particulary long > 45 minutes\
    \ or hard > 50 TSS. Set is_commute=true \nand leave coach_recommendations empty\
    \ unless quality analysis has been performed. Training \nphilosophy may also describe\
    \ how commutes shall be reported. If so, use the philosophy's \ninstructions.\n\
    \nFor ERG mode sessions (is_erg_mode=true): note that ERG was active, then focus\
    \ exclusively\non cadence patterns and HR response. Do NOT comment on power stability,\
    \ pacing evenness,\nor power consistency — these are controlled by the trainer,\
    \ not the athlete.\n\nCadence units: cycling=RPM, running=SPM. Never compare cadence\
    \ values across sports.\nInterval recovery-segment cadence: a low cadence (well\
    \ below the work-interval cadence) during the recovery portion of a hill/climb\
    \ interval session is commonly just coasting on the descent back down between\
    \ reps, not drift or a technique issue — riders naturally stop or soft-pedal on\
    \ a steep downhill recovery. Only raise recovery-segment cadence as something\
    \ to clarify with the athlete when the session/course context doesn't explain\
    \ it (e.g. flat terrain, or a recovery interval with no associated descent).\n\
    Running power (GPS/foot pod) is not the same as cycling power — do not cross-reference.\n\
    \nIgnore isolated abnormal values at the very start of an activity (warm-up artefacts).\n\
    \nFor all other sessions, for each workout provide:\n1. Executive summary: coach-facing\
    \ takeaway (2-3 sentences, max 50 words)\n2. Quantitative summary: TSS, IF, power\
    \ vs FTP, HR response, zone distribution\n3. Qualitative assessment: execution\
    \ quality, pacing, zone adherence\n4. Progress indicators: how this session fits\
    \ the athlete's training trajectory\n5. Risk flags: genuine concerns only — not\
    \ low-severity power blips or single-lap anomalies\n6. Coach recommendations:\
    \ specific and actionable (max 30 words each)\n7. Data gaps: missing data that\
    \ materially limits the analysis. Do NOT flag\n   missing speed or pace data for\
    \ power-based cycling sessions — speed is not\n   needed when power, HR, and zone\
    \ data are present. Only flag missing speed/pace\n   for GPS running or cycling\
    \ sessions where pace is the primary training metric\n   and power data is absent.\n\
    \nIf a workout includes `athlete_rpe` (Rate of Perceived Exertion, 1-10) or `athlete_notes`,\n\
    treat these as primary evidence. RPE gives the athlete's subjective effort signal;\
    \ notes may\ndescribe incidents, external conditions, or other context that affects\
    \ how the session was\nexecuted. Factor both into the qualitative assessment,\
    \ risk flags, and recommendations.\nA mismatch between objective load (IF, HR)\
    \ and RPE is itself a meaningful finding.\n\nVerify all metric comparisons numerically\
    \ from the provided data.\nList key sessions first, commutes last in the workouts\
    \ array.\nSet no_data=true (and leave workouts empty) if the tool returns no workout\
    \ data.\n\nIf training_philosophy is present in the tool data, apply its analyst_guidance\
    \ — it defines what this athlete's model means and which statuses warrant a flag.\
    \ Base any philosophy comment solely on the precomputed weekly_philosophy_assessment\
    \ (a weekly verdict), never on per-session classification, and do not recompute\
    \ or reclassify anything yourself. Raise a philosophy risk_flag only when analyst_guidance\
    \ calls for one given the current status, and make no philosophy claim at all\
    \ when the assessment reflects insufficient data.\n\nIf week_category is present\
    \ in the tool data, use it to calibrate expectations before flagging\nload: higher\
    \ training stress during a declared build or race week is deliberate, not a risk_flag\n\
    on its own. Low or zero volume during a declared taper, restitution, or recovering\
    \ week is the\nplan, not a data gap — do not flag it as missing training. Only\
    \ raise a risk_flag when the day's\nactual execution runs counter to what the\
    \ declared category predicts."
  expected_output: |
    A JSON object with the workout analysis. If no workouts: no_data=true, workouts=[].
    daily_summary captures the key highlight and primary recommendation for the whole day.
    Each workout in the workouts array includes all fields defined in the schema.
